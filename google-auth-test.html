<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sign-In Test — Aurevia</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h2 { color: #333; }
    button {
      padding: 12px 24px;
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #3367d6; }
    #result {
      margin-top: 24px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      display: none;
    }
    #token-box {
      width: 100%;
      height: 120px;
      font-size: 12px;
      font-family: monospace;
      background: #1e1e1e;
      color: #4ec9b0;
      padding: 10px;
      border-radius: 6px;
      border: none;
      resize: vertical;
      box-sizing: border-box;
    }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 18px;
      background: #28a745;
      font-size: 14px;
    }
    .copy-btn:hover { background: #218838; }
    .user-info { margin-bottom: 12px; color: #555; }
    .label { font-weight: bold; color: #333; margin-bottom: 6px; display: block; }
    .note {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff8e1;
      border-left: 4px solid #ffc107;
      border-radius: 4px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <h2>🔥 Firebase Google Sign-In Test</h2>
  <p>اضغط الزر، سجّل بحساب Google، وهياخد الـ <code>firebaseIdToken</code> تلقائياً.</p>

  <button onclick="signInWithGoogle()">Sign in with Google</button>

  <div id="result">
    <div class="user-info" id="user-info"></div>
    <span class="label">🔑 firebaseIdToken (انسخه لـ Postman):</span>
    <textarea id="token-box" readonly></textarea>
    <br/>
    <button class="copy-btn" onclick="copyToken()">📋 Copy Token</button>
    <div class="note">
      ⚠️ الـ Token صالح لمدة <strong>1 ساعة</strong> فقط. لو انتهت صلاحيته، اضغط Sign in تاني.
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6fNdNqH8HfA1Lh2VBIZ14yidtIOduDD4",
      authDomain: "aurevia-4b1f2.firebaseapp.com",
      projectId: "aurevia-4b1f2",
      storageBucket: "aurevia-4b1f2.firebasestorage.app",
      messagingSenderId: "475204451349",
      appId: "1:475204451349:web:575c663a59f705d9ba221c",
      measurementId: "G-E8RDSXPS7W"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Expose to global scope for the onclick handler
    window.signInWithGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const idToken = await user.getIdToken();

        document.getElementById("user-info").innerHTML =
          `✅ <strong>مرحباً ${user.displayName}</strong> (${user.email})`;

        document.getElementById("token-box").value = idToken;
        document.getElementById("result").style.display = "block";

        // Auto-select the token
        document.getElementById("token-box").select();

      } catch (err) {
        alert("❌ خطأ: " + err.message);
        console.error(err);
      }
    };

    window.copyToken = () => {
      const box = document.getElementById("token-box");
      box.select();
      navigator.clipboard.writeText(box.value).then(() => {
        alert("✅ تم نسخ الـ Token!");
      });
    };
  </script>

</body>
</html>
